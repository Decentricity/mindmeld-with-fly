[project]
name = "mindmeld"
version = "0.1.0"
description = "Sparse MaleCNS reservoir: Phase 1 research prototype"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.10.0",
  "numpy>=2.2,<3",
  "scipy>=1.15,<2",
  "pyarrow>=20,<26",
  "matplotlib>=3.10,<4",
  "pytest>=8,<10",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
